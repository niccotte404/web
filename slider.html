<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Слайдер мемов</title>
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js" defer></script>
    <script src="scripts/slider.js" defer></script>
    <script src="scripts/navigation.js" defer></script>
</head>
<body class="page">

<header class="header">
    <div class="header__container">
        <h1 class="header__title">Бебебе с бабаба</h1>
        <nav class="header__nav">
            <ul class="nav__list">
                <li class="nav__item"><a href="index.html" class="nav__link">Главная</a></li>
                <li class="nav__item"><a href="info.html" class="nav__link">Информация</a></li>
                <li class="nav__item"><a href="task_tracker.html" class="nav__link">Задачи</a></li>
                <li class="nav__item"><a href="slider.html" class="nav__link nav__link_active">Слайдер</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="main-content">
    <section class="memes">
        <div class="container">
            <h2 class="memes__title">Галерея мемов</h2>
            <div class="swiper-container">
                <div class="swiper-wrapper">
                    <!-- Слайды -->
                    <div class="swiper-slide">
                        <img src="img/i1.jpg" alt="Мем 1" class="meme-card__image">
                    </div>
                    <div class="swiper-slide">
                        <img src="img/i2.jpg" alt="Мем 2" class="meme-card__image">
                    </div>
                    <div class="swiper-slide">
                        <img src="img/i3.jpg" alt="Мем 3" class="meme-card__image">
                    </div>
                    <div class="swiper-slide">
                        <img src="img/meme1.jpg" alt="Мем 3" class="meme-card__image">
                    </div>
                </div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-pagination"></div>
            </div>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="container">
        <p class="footer__text">&copy; 2024 Все права защищены</p>
    </div>
</footer>

</body>
</html>
